# ============================================================
# CCIFA Coding World Cup — full stack
# ============================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ccifa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccifa
      POSTGRES_PASSWORD: ccifa
      POSTGRES_DB: matchcore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccifa -d matchcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ccifa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  matchcore:
    build:
      context: .
      dockerfile: matchcore/infra/docker/Dockerfile.matchcore
    container_name: ccifa-matchcore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ccifa:ccifa@postgres:5432/matchcore
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      MATCHCORE_HOST: 0.0.0.0
      MATCHCORE_PORT: 8000
      MATCHCORE_RULES_PATH: matchcore/rules/v1.0
      SEAL_LEDGER_PATH: /data/sovereign-ledger.jsonl
      ARENA_OFFLINE: "true"
    ports:
      - "8000:8000"
    volumes:
      - matchcore-data:/data
      - ./matchcore:/app/matchcore:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: matchcore/infra/docker/Dockerfile.dashboard
    container_name: ccifa-dashboard
    restart: unless-stopped
    depends_on:
      - matchcore
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: ccifa-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: ccifa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ccifa-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dev-minio-key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  matchcore-data:
  meili-data:
  minio-data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: matchcore
    metrics_path: /metrics
    static_configs:
      - targets: ["matchcore:8000"]
        labels:
          service: matchcore
  - job_name: dashboard
    static_configs:
      - targets: ["dashboard:80"]
  - job_name: arena-nodes
    static_configs:
      - targets:
          - arena-node-1:9100
          - arena-node-2:9100
          - arena-node-3:9100

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
